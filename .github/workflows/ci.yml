name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.os }} py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[test]"
      - name: Test
        run: python -m pytest tests/ -v --durations=10

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check src tests benchmarks
      - run: ruff format --check src tests benchmarks

  sanitizers:
    # The package ships a native extension, so memory errors are crashes in a
    # user's interpreter rather than Python exceptions. Build the core with
    # ASan/UBSan and run the suite under it.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build with sanitizers
        env:
          CMAKE_ARGS: >-
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer -g"
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
        run: python -m pip install -e ".[test]"
      - name: Run tests under sanitizers
        env:
          LD_PRELOAD: /usr/lib/x86_64-linux-gnu/libasan.so.8
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: python -m pytest tests/ -x -q

  wheels:
    name: wheels ${{ matrix.os }}
    # Only build wheels where they will be published from; keeps PR CI fast.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-13, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pypa/cibuildwheel@v2.21
        env:
          # No -march=native anywhere: a wheel must run on every machine that
          # installs it. Measured on the reference datasets, native tuning gave
          # no reproducible speedup, so there is nothing to trade away.
          CIBW_BUILD: "cp39-* cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_i686 *_i686"
          CIBW_TEST_REQUIRES: pytest
          CIBW_TEST_COMMAND: python -m pytest {project}/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    # The wheels above were being built and then thrown away: everything needed
    # to release existed except the step that releases. Pushing a v* tag now
    # publishes what CI just built and tested.
    #
    # One-time setup before the first tag: create the project on PyPI and add a
    # trusted publisher for this repository, workflow `ci.yml`, environment
    # `pypi`. Trusted publishing uses a short-lived OIDC token, so there is no
    # API token to store or rotate.
    name: publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, sanitizers, wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "{wheels-*,sdist}"
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
