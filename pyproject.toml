[build-system]
requires = ["scikit-build-core>=0.9", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "sxe"
version = "0.1.0.dev0"
description = "Sparse eXtra Ensembles: batch-boosted, holdout-pruned tree ensembles for scikit-learn"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Alastair Rushworth" }]
keywords = [
    "machine-learning",
    "gradient-boosting",
    "decision-trees",
    "ensemble",
    "scikit-learn",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.22",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=7"]
bench = ["lightgbm>=4", "pandas>=1.5"]

[project.urls]
Homepage = "https://github.com/alastairrushworth/sxe"
Source = "https://github.com/alastairrushworth/sxe"

[tool.scikit-build]
minimum-version = "0.9"
build-dir = "build/{wheel_tag}"
wheel.packages = ["src/sxe"]
sdist.exclude = ["build", "*.so", "*.dylib", "*.pyd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::RuntimeWarning"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]
